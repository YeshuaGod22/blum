<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blum / Reply Census</title><style>
:root{--bg:#0a0a0c;--s:#121216;--s2:#19191f;--b:#2c2c35;--t:#d9d9e1;--d:#7d7d8a;--a:#e8a44a;--g:#64b978;--m:ui-monospace,SFMono-Regular,Menlo,monospace;--f:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:var(--f)}header{position:sticky;top:0;z-index:4;background:rgba(10,10,12,.97);border-bottom:1px solid var(--b);padding:12px 16px}.brand{font:700 14px var(--m);color:var(--a)}.controls{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:7px;margin-top:10px}input,select,button{background:var(--s2);color:var(--t);border:1px solid var(--b);border-radius:5px;padding:7px;font:11px var(--m)}button{cursor:pointer}main{padding:14px 16px;max-width:1800px;margin:auto}.summary{font:11px var(--m);color:var(--d);margin-bottom:10px}.tablewrap{overflow:auto;border:1px solid var(--b);border-radius:8px}table{width:100%;border-collapse:collapse;font-size:12px}th{position:sticky;top:0;background:#15151a;color:var(--a);font:10px var(--m);text-align:left;padding:8px;border-bottom:1px solid var(--b);white-space:nowrap}td{padding:8px;vertical-align:top;border-bottom:1px solid #202027}.mono{font:10px/1.45 var(--m);color:var(--d);white-space:nowrap}.reply{white-space:pre-wrap;min-width:420px;max-width:800px;line-height:1.45}.empty{color:var(--d);padding:30px;text-align:center}.pill{display:inline-block;border:1px solid var(--b);border-radius:999px;padding:2px 6px;font:9px var(--m)}@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.reply{min-width:300px}}</style></head><body>
<header><div class="brand">BLUM / REPLY CENSUS</div><div class="controls"><input id="file" type="file" accept="application/json"><input id="search" placeholder="search reply or metadata"><select id="collection"><option value="">all collections</option></select><select id="item"><option value="">all items</option></select><select id="condition"><option value="">all conditions</option></select><select id="fork"><option value="">all forks</option></select></div></header>
<main><div id="summary" class="summary">Load dae-whole-corpus-index-v1.json. This view shows every observation with non-empty sections.reply content.</div><div class="tablewrap"><table><thead><tr><th>collection</th><th>item</th><th>condition</th><th>fork</th><th>rep</th><th>reply</th><th>source</th><th>observation</th></tr></thead><tbody id="body"><tr><td colspan="8" class="empty">No index loaded.</td></tr></tbody></table></div></main>
<script>
const $=id=>document.getElementById(id);let rows=[];
function text(v){return Array.isArray(v)?v.map(x=>String(x??'')).join('\n\n').trim():String(v??'').trim()}
function flattenIndex(index){const out=[],seen=new Set();const push=(r,itemId)=>{if(!r)return;const reply=text(r.sections&&r.sections.reply);if(!reply)return;const key=r.observationId||[r.sourcePath,r.collection,r.condition,r.replicate,r.forkId,itemId].join('|');if(seen.has(key))return;seen.add(key);out.push({...r,_item:itemId||r.itemId||r.probeId||'',_reply:reply});};
  if(index&&index.itemHistories)for(const [itemId,h] of Object.entries(index.itemHistories))for(const r of h.observations||[])push(r,itemId);
  for(const r of (index&&index.observations)||[])push(r,r.itemId||r.probeId||'');
  return out;
}
function options(id,vals,label){const el=$(id),old=el.value;el.innerHTML=`<option value="">all ${label}</option>`+[...new Set(vals.filter(v=>v!==null&&v!==undefined&&String(v)!==''))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true})).map(v=>`<option>${esc(v)}</option>`).join('');if([...el.options].some(o=>o.value===old))el.value=old}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('search').value.toLowerCase(),filters={collection:$('collection').value,item:$('item').value,condition:$('condition').value,fork:$('fork').value};const shown=rows.filter(r=>(!filters.collection||String(r.collection)===filters.collection)&&(!filters.item||String(r._item)===filters.item)&&(!filters.condition||String(r.condition??'')===filters.condition)&&(!filters.fork||String(r.forkId??'')===filters.fork)&&(!q||[r._reply,r.collection,r._item,r.condition,r.forkId,r.sourcePath,r.observationId].join(' ').toLowerCase().includes(q)));$('summary').textContent=`${shown.length} visible / ${rows.length} observations with non-empty <reply> content`;$('body').innerHTML=shown.length?shown.map(r=>`<tr><td class="mono">${esc(r.collection)}</td><td class="mono">${esc(r._item)}</td><td class="mono">${esc(r.condition??'—')}</td><td class="mono">${esc(r.forkId??'—')}</td><td class="mono">${esc(r.replicate??'—')}</td><td class="reply">${esc(r._reply)}</td><td class="mono">${esc(r.sourcePath??'—')}</td><td class="mono">${esc(r.observationId??'—')}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">No matching reply sections.</td></tr>'}
$('file').onchange=async e=>{const index=JSON.parse(await e.target.files[0].text());rows=flattenIndex(index);options('collection',rows.map(r=>r.collection),'collections');options('item',rows.map(r=>r._item),'items');options('condition',rows.map(r=>r.condition),'conditions');options('fork',rows.map(r=>r.forkId),'forks');render()};['search','collection','item','condition','fork'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
</script></body></html>
