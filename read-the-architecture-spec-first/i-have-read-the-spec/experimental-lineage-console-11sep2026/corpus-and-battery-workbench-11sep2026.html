<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blum Corpus + Battery Workbench — 11 Sep 2026</title>
<style>
:root{--bg:#0a0a0c;--s:#121216;--s2:#19191f;--b:#2c2c35;--t:#d9d9e1;--d:#777785;--a:#e8a44a;--g:#64b978;--u:#6293de;--r:#dc6b6b;--p:#ad83d6;--m:ui-monospace,SFMono-Regular,Menlo,monospace;--f:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:var(--f);font-size:14px}button,input,textarea,select{font:inherit}header{display:flex;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--b);position:sticky;top:0;background:rgba(10,10,12,.96);z-index:5}.brand{font:700 13px var(--m);color:var(--a)}.sub{font:11px var(--m);color:var(--d)}.push{margin-left:auto}button{background:var(--s2);color:var(--t);border:1px solid var(--b);border-radius:5px;padding:7px 10px;cursor:pointer}button:hover{border-color:#555565}.primary{background:var(--a);color:#15110a;border-color:var(--a);font-weight:700}.good{color:var(--g);border-color:rgba(100,185,120,.5)}.shell{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:14px;padding:14px}.panel{border:1px solid var(--b);background:var(--s);border-radius:8px;overflow:hidden}.head{padding:10px 12px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:8px}.body{padding:12px}.ey{font:10px var(--m);text-transform:uppercase;letter-spacing:.12em;color:var(--d)}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button.active{color:var(--a);border-color:rgba(232,164,74,.55);background:rgba(232,164,74,.08)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}.stat{border:1px solid var(--b);background:var(--bg);padding:8px;border-radius:5px}.stat b{display:block;font:18px var(--m);color:#f1f1f6}.stat span{font:9px var(--m);color:var(--d);text-transform:uppercase}.lineage{display:grid;gap:7px}.trunk{border:1px solid var(--b);background:var(--bg);border-radius:6px;padding:8px}.trunkTop{display:flex;align-items:center;gap:8px}.badge{font:10px var(--m);padding:2px 5px;border:1px solid var(--b);border-radius:3px;color:var(--d)}.forks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin:7px 0 0 20px}.fork{border-left:3px solid var(--u);background:var(--s2);padding:7px;border-radius:4px}.fork.exact{border-left-color:var(--g)}.coverageWrap{overflow:auto}.coverage{border-collapse:separate;border-spacing:3px;font:10px var(--m);min-width:100%}.coverage th{color:var(--d);font-weight:400;padding:5px}.coverage td{border:1px solid var(--b);padding:6px;text-align:center;border-radius:3px;min-width:48px}.coverage td.hit{background:rgba(100,185,120,.12);color:var(--g);border-color:rgba(100,185,120,.4)}.coverage td.warn{background:rgba(232,164,74,.12);color:var(--a);border-color:rgba(232,164,74,.4)}.anomaly{border-left:3px solid var(--r);background:rgba(220,107,107,.08);padding:8px;margin:5px 0;font:11px/1.45 var(--m)}.hidden{display:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font:10px var(--m);color:var(--d);margin-bottom:4px}.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:4px;color:var(--t);padding:7px}.field textarea{min-height:58px;resize:vertical}.batteryItems{margin-top:10px}.item{display:grid;grid-template-columns:70px 65px 1fr 110px 90px auto;gap:5px;margin:5px 0;align-items:start}.item input,.item select{width:100%;background:var(--bg);border:1px solid var(--b);color:var(--t);border-radius:4px;padding:6px}.item .text{min-width:0}.groups{display:grid;gap:6px}.group{display:grid;grid-template-columns:110px 1fr auto;gap:5px}.group input{background:var(--bg);border:1px solid var(--b);color:var(--t);border-radius:4px;padding:6px}.notice{border-left:3px solid var(--a);background:rgba(232,164,74,.09);padding:8px;font-size:11px;line-height:1.5;margin:8px 0}.ok{border-left-color:var(--g);background:rgba(100,185,120,.09)}pre{white-space:pre-wrap;word-break:break-word;font:10px/1.5 var(--m);background:var(--bg);padding:9px;border:1px solid var(--b);border-radius:5px;max-height:240px;overflow:auto}@media(max-width:1050px){.shell{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.item{display:flex;flex-wrap:wrap}.item .text{flex:1 1 100%}.group{grid-template-columns:1fr}}
</style></head>
<body>
<header><div><div class="brand">BLUM / CORPUS + BATTERY WORKBENCH</div><div class="sub">lineage navigation · coverage · reusable probe instruments</div></div><div class="push"></div><button id="loadCorpusBtn">Load corpus view JSON</button><input id="corpusFile" type="file" accept="application/json" hidden><button id="exportBatteryBtn">Export battery</button></header>
<div class="shell">
<section class="panel"><div class="head"><strong>Corpus Explorer</strong><div class="push tabs"><button data-tab="lineage" class="active">Lineage</button><button data-tab="coverage">Coverage</button><button data-tab="anomalies">Anomalies</button></div></div><div class="body">
<div id="corpusStats" class="stats"></div>
<div id="lineageView"></div><div id="coverageView" class="hidden"></div><div id="anomaliesView" class="hidden"></div>
</div></section>
<section class="panel"><div class="head"><strong>Battery Library</strong><span id="batteryStatus" class="badge push">draft v1</span></div><div class="body">
<div class="grid2"><div class="field"><label>BATTERY ID</label><input id="batteryId" value="core-battery"></div><div class="field"><label>NAME</label><input id="batteryName" value="Core Battery"></div></div>
<div class="field" style="margin-top:8px"><label>DESCRIPTION</label><textarea id="batteryDescription">Reusable typed probe instruments for developmental lineage experiments.</textarea></div>
<div class="head" style="padding-left:0;padding-right:0;margin-top:10px"><span class="ey">Items</span><button id="addItemBtn" class="push">+ item</button></div><div id="batteryItems" class="batteryItems"></div>
<div class="head" style="padding-left:0;padding-right:0;margin-top:10px"><span class="ey">Saved groups</span><button id="addGroupBtn" class="push">+ group</button></div><div id="groups" class="groups"></div>
<div class="head" style="padding-left:0;padding-right:0;margin-top:10px"><span class="ey">Attach frozen battery</span></div><div class="grid2"><div class="field"><label>BRANCH IDS</label><input id="branchIds" value="a,0"></div><div class="field"><label>GROUP IDS</label><input id="groupIds" value="R_T_U_Y"></div></div>
<div id="batteryNotice" class="notice">Draft batteries cannot be attached to frozen experiments.</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button id="freezeBatteryBtn" class="primary">Freeze battery</button><button id="newVersionBtn" class="good" disabled>New draft version</button><button id="makeAttachmentBtn" disabled>Make attachment</button></div>
<pre id="attachmentPreview">No attachment yet.</pre>
</div></section>
</div>
<script>
(()=>{
const demo={summary:{rawCallsImported:852,trunkTurns:108,branchObservations:744,coldObservations:0,exact_shared_parent:372,trunkInstances:12,families:4,probes:24,anomalyCount:3},families:['AS','CP','F','H'],probes:['A1','E01','N4','N9','W1','W2'],lineage:[{key:'AS:r1',family:'AS',replicate:1,turns:Array.from({length:9},(_,i)=>({turn:i+1,outcome:'complete'})),forks:[{fork:'a',probeIds:['A1','E01','N4','N9','W1','W2'],parentSnapshotIds:['snap_demo'],anomalies:[]},{fork:'0',probeIds:['A1','E01','N4','N9','W1','W2'],parentSnapshotIds:['snap_demo'],anomalies:[]}],anomalies:[]},{key:'H:r1',family:'H',replicate:1,turns:Array.from({length:9},(_,i)=>({turn:i+1,outcome:i===4?'truncated':'complete',stopReason:i===4?'max_tokens':null,sourcePath:i===4?'H-r1-t5.json':null})),forks:[{fork:'a',probeIds:['A1','E01','N4','N9'],parentSnapshotIds:['snap_h'],anomalies:[]},{fork:'0',probeIds:['A1','E01','N4','N9'],parentSnapshotIds:['snap_h'],anomalies:[]}],anomalies:[{turn:5,outcome:'truncated',stopReason:'max_tokens',sourcePath:'H-r1-t5.json'}]}],coverage:[],anomalies:[{lineageKey:'H:r1',turn:5,outcome:'truncated',stopReason:'max_tokens',sourcePath:'H-r1-t5.json'},{lineageKey:'F:r3',turn:8,outcome:'complete',stopReason:'end_turn',sourcePath:'F-r3-t8.json',integrity:'recovered_unclosed'},{lineageKey:'F:r3',turn:9,outcome:'complete',stopReason:'end_turn',sourcePath:'F-r3-t9.json',integrity:'recovered_unclosed'}],exactContrasts:Array.from({length:372},(_,i)=>({probeId:'N4',contrastType:'exact_shared_parent',parentSnapshotId:'snap_'+i}))};
for(const t of demo.lineage)for(const f of t.forks)for(const p of f.probeIds)demo.coverage.push({rowKey:`${t.family}:r${t.replicate}:${f.fork}`,family:t.family,replicate:t.replicate,fork:f.fork,probeId:p,count:1,outcomes:{complete:1},exactSiblingContrast:true});
let corpus=demo;
let battery={batteryId:'core-battery',name:'Core Battery',version:1,status:'draft',description:'Reusable typed probe instruments for developmental lineage experiments.',fingerprint:null,frozenAt:null,items:[{id:'R1',family:'R',construct:'recurrence',text:'',responseType:'free',scorer:''},{id:'T1',family:'T',construct:'threshold',text:'',responseType:'threshold',scorer:''},{id:'U1',family:'U',construct:'uncertainty',text:'',responseType:'credence',scorer:''},{id:'Y1',family:'Y',construct:'integration',text:'',responseType:'free',scorer:''}],groups:[{id:'R_T_U_Y',label:'R / T / U / Y',itemIds:['R1','T1','U1','Y1']} ]};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function renderCorpus(){const s=corpus.summary||{};$('#corpusStats').innerHTML=[[s.trunkInstances??corpus.lineage?.length??0,'parent trunks'],[s.rawCallsImported??0,'calls'],[corpus.exactContrasts?.length??0,'exact contrasts'],[corpus.probes?.length??0,'probes'],[corpus.anomalies?.length??0,'anomalies']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
$('#lineageView').innerHTML=`<div class="lineage">${(corpus.lineage||[]).map(t=>`<div class="trunk"><div class="trunkTop"><span class="badge">${esc(t.family)} · r${esc(t.replicate)}</span><strong>${t.turns?.length||0} trunk turns</strong><span class="push sub">${t.anomalies?.length||0} trunk anomalies</span></div><div class="forks">${(t.forks||[]).map(f=>`<div class="fork ${f.parentSnapshotIds?.length===1?'exact':''}"><strong>fork ${esc(f.fork)}</strong><div class="sub">${f.probeIds?.length||0} probes</div><div class="sub">${f.parentSnapshotIds?.length===1?'one verified parent':'parent set: '+(f.parentSnapshotIds?.length||0)}</div></div>`).join('')}</div></div>`).join('')}</div>`;
const probes=corpus.probes||[];const rows=[...new Set((corpus.coverage||[]).map(c=>c.rowKey))];$('#coverageView').innerHTML=`<div class="coverageWrap"><table class="coverage"><thead><tr><th>lineage</th>${probes.map(p=>`<th>${esc(p)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><th>${esc(r)}</th>${probes.map(p=>{const c=(corpus.coverage||[]).find(x=>x.rowKey===r&&x.probeId===p);if(!c)return'<td>—</td>';const bad=Object.keys(c.outcomes||{}).some(k=>k!=='complete');return`<td class="${bad?'warn':'hit'}" title="${esc(JSON.stringify(c.outcomes||{}))}">${c.count||1}${c.exactSiblingContrast?' · ⟷':''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="notice ok">⟷ marks cells participating in a verified exact-parent sibling contrast.</div>`;
$('#anomaliesView').innerHTML=(corpus.anomalies||[]).length?(corpus.anomalies||[]).map(a=>`<div class="anomaly"><b>${esc(a.lineageKey||'lineage')}</b> · ${esc(a.sourcePath||'unknown source')}<br>${esc(a.outcome||'section integrity')} · ${esc(a.stopReason||a.integrity||'')}</div>`).join(''):'<div class="notice ok">No recorded anomalies.</div>'}
function renderBattery(){$('#batteryStatus').textContent=`${battery.status} v${battery.version}`;$('#batteryId').value=battery.batteryId;$('#batteryName').value=battery.name;$('#batteryDescription').value=battery.description;const locked=battery.status==='frozen';for(const el of [$('#batteryId'),$('#batteryName'),$('#batteryDescription')])el.disabled=locked;$('#batteryItems').innerHTML=battery.items.map((x,i)=>`<div class="item"><input ${locked?'disabled':''} data-i="${i}" data-k="id" value="${esc(x.id)}" aria-label="Item ID"><input ${locked?'disabled':''} data-i="${i}" data-k="family" value="${esc(x.family)}" aria-label="Family"><input class="text" ${locked?'disabled':''} data-i="${i}" data-k="text" value="${esc(x.text)}" placeholder="canonical prompt text"><select ${locked?'disabled':''} data-i="${i}" data-k="responseType">${['free','credence','threshold','allocation','bipolar','tripolar','sentinel'].map(v=>`<option ${x.responseType===v?'selected':''}>${v}</option>`).join('')}</select><input ${locked?'disabled':''} data-i="${i}" data-k="construct" value="${esc(x.construct)}" placeholder="construct"><button ${locked?'disabled':''} data-remove-item="${i}">×</button></div>`).join('');$('#groups').innerHTML=battery.groups.map((g,i)=>`<div class="group"><input ${locked?'disabled':''} data-g="${i}" data-k="id" value="${esc(g.id)}"><input ${locked?'disabled':''} data-g="${i}" data-k="itemIds" value="${esc(g.itemIds.join(','))}" title="comma-separated item IDs"><button ${locked?'disabled':''} data-remove-group="${i}">×</button></div>`).join('');$('#addItemBtn').disabled=locked;$('#addGroupBtn').disabled=locked;$('#freezeBatteryBtn').disabled=locked;$('#newVersionBtn').disabled=!locked;$('#makeAttachmentBtn').disabled=!locked;$('#batteryNotice').className='notice '+(locked?'ok':'');$('#batteryNotice').textContent=locked?`Frozen ${battery.fingerprint?.slice(0,28)||''}… · safe to attach by reference.`:'Draft batteries cannot be attached to frozen experiments.'}
function syncBattery(){if(battery.status==='frozen')return;battery.batteryId=$('#batteryId').value.trim();battery.name=$('#batteryName').value.trim();battery.description=$('#batteryDescription').value}
function canonical(v){if(v===null||typeof v!=='object')return JSON.stringify(v);if(Array.isArray(v))return'['+v.map(canonical).join(',')+']';return'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonical(v[k])).join(',')+'}'}
async function hash(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonical(v)));return'sha256:'+Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function download(obj,name){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
renderCorpus();renderBattery();
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');for(const id of ['lineage','coverage','anomalies'])$('#'+id+'View').classList.toggle('hidden',id!==b.dataset.tab)}));
$('#loadCorpusBtn').addEventListener('click',()=>$('#corpusFile').click());$('#corpusFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.lineage)||!Array.isArray(x.coverage))throw new Error('expected blum-corpus-visualization-v0 shape');corpus=x;renderCorpus()}catch(err){alert('Corpus view import failed: '+err.message)}};r.readAsText(f);e.target.value=''});
for(const id of ['batteryId','batteryName','batteryDescription'])$('#'+id).addEventListener('input',syncBattery);
$('#batteryItems').addEventListener('input',e=>{if(battery.status==='frozen')return;const i=+e.target.dataset.i,k=e.target.dataset.k;if(Number.isInteger(i)&&k)battery.items[i][k]=e.target.value});$('#batteryItems').addEventListener('click',e=>{const i=e.target.dataset.removeItem;if(i!=null&&battery.status!=='frozen'){battery.items.splice(+i,1);renderBattery()}});
$('#groups').addEventListener('input',e=>{if(battery.status==='frozen')return;const i=+e.target.dataset.g,k=e.target.dataset.k;if(!Number.isInteger(i)||!k)return;battery.groups[i][k]=k==='itemIds'?e.target.value.split(',').map(x=>x.trim()).filter(Boolean):e.target.value});$('#groups').addEventListener('click',e=>{const i=e.target.dataset.removeGroup;if(i!=null&&battery.status!=='frozen'){battery.groups.splice(+i,1);renderBattery()}});
$('#addItemBtn').addEventListener('click',()=>{battery.items.push({id:'Q'+String(battery.items.length+1).padStart(2,'0'),family:'',construct:'',text:'',responseType:'free',scorer:''});renderBattery()});$('#addGroupBtn').addEventListener('click',()=>{battery.groups.push({id:'GROUP_'+(battery.groups.length+1),label:'',itemIds:[]});renderBattery()});
$('#freezeBatteryBtn').addEventListener('click',async()=>{syncBattery();const ids=battery.items.map(x=>x.id);if(!battery.batteryId||!battery.name||ids.some(x=>!x)||new Set(ids).size!==ids.length){alert('Battery ID, name, and unique item IDs are required.');return}for(const g of battery.groups)for(const id of g.itemIds)if(!ids.includes(id)){alert(`Group ${g.id} references unknown item ${id}`);return}battery.status='frozen';battery.frozenAt=new Date().toISOString();const snap={...battery,fingerprint:null};battery.fingerprint=await hash(snap);renderBattery()});
$('#newVersionBtn').addEventListener('click',()=>{const parent=battery.fingerprint;battery=JSON.parse(JSON.stringify(battery));battery.version++;battery.status='draft';battery.frozenAt=null;battery.fingerprint=null;battery.provenance={createdFromFingerprint:parent};renderBattery()});
$('#makeAttachmentBtn').addEventListener('click',()=>{if(battery.status!=='frozen')return;const branches=$('#branchIds').value.split(',').map(x=>x.trim()).filter(Boolean);const groupIds=$('#groupIds').value.split(',').map(x=>x.trim()).filter(Boolean);let ids=[];for(const gid of groupIds){const g=battery.groups.find(x=>x.id===gid);if(!g){alert('Unknown group '+gid);return}ids.push(...g.itemIds)}if(!groupIds.length)ids=battery.items.map(x=>x.id);ids=[...new Set(ids)];const a={schema:'blum-battery-attachment-v0',batteryRef:{batteryId:battery.batteryId,version:battery.version,fingerprint:battery.fingerprint},branchIds:branches,selectedGroupIds:groupIds,selectedItemIds:ids,order:'canonical'};$('#attachmentPreview').textContent=JSON.stringify(a,null,2)});
$('#exportBatteryBtn').addEventListener('click',()=>download(battery,`${battery.batteryId||'battery'}-v${battery.version}.json`));
})();
</script></body></html>
