<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blum Adjudication Jury Room</title><style>
:root{--bg:#0a0a0c;--s:#121216;--b:#2d2d35;--t:#dddde5;--d:#7f7f8d;--a:#e8a44a;--g:#69b97a;--r:#d46f6f;--m:ui-monospace,SFMono-Regular,Menlo,monospace;--f:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:var(--f)}main{max-width:1450px;margin:auto;padding:28px 18px}h1,h2{font-family:var(--m)}h1{font-size:20px;color:var(--a)}p,.muted{color:var(--d)}.bar,.grid{display:grid;gap:10px}.bar{grid-template-columns:1fr 1fr auto auto}.grid{grid-template-columns:320px 1fr 420px;margin-top:14px}.panel{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:12px;min-height:240px}.queue{max-height:70vh;overflow:auto}.row{padding:9px;border:1px solid var(--b);border-radius:6px;margin:0 0 7px;cursor:pointer;font:11px/1.4 var(--m)}.row:hover,.row.active{border-color:var(--a)}.tag{display:inline-block;padding:2px 5px;border-radius:4px;font:10px var(--m);border:1px solid var(--b)}.resolved{color:var(--g)}.escalate,.incomplete{color:var(--r)}button,input,select{background:#0d0d10;color:var(--t);border:1px solid var(--b);border-radius:5px;padding:8px;font:11px var(--m)}button{cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;font:11px/1.5 var(--m);background:#0d0d10;border:1px solid var(--b);padding:10px;border-radius:6px}.vote{border-top:1px solid var(--b);padding:8px 0;font:11px/1.45 var(--m)}@media(max-width:1000px){.grid{grid-template-columns:1fr}.bar{grid-template-columns:1fr}}
</style></head><body><main><h1>BLUM / ADJUDICATION JURY ROOM</h1><p>Review imported independent judgments without overwriting raw, mechanical, or panel layers. This tool reconciles; it does not call providers.</p>
<div class="bar"><input id="executionFile" type="file" accept="application/json,.json"><input id="judgementsFile" type="file" accept="application/json,.json,.jsonl"><select id="statusFilter"><option value="all">all statuses</option><option value="escalate">escalate</option><option value="incomplete">incomplete</option><option value="resolved">resolved</option></select><button id="runBtn">RECONCILE</button></div>
<div id="summary" class="muted" style="margin-top:10px;font:11px var(--m)">Load execution + judgments.</div>
<div class="grid"><section class="panel"><h2>Queue</h2><div id="queue" class="queue"></div></section><section class="panel"><h2>Evidence</h2><div id="evidence" class="muted">Select a unit.</div></section><section class="panel"><h2>Panel</h2><div id="panel" class="muted">Select a unit.</div></section></div>
</main><script src="./adjudication-execution-core-v1-13sep2026.js"></script><script>
const $=id=>document.getElementById(id);let execution=null,judgements=[],results=[],assignments=[];
async function readJson(file){const t=await file.text();if(file.name.endsWith('.jsonl'))return t.split(/\r?\n/).filter(Boolean).map(x=>JSON.parse(x));return JSON.parse(t);}
$('executionFile').onchange=async e=>{execution=await readJson(e.target.files[0]);$('summary').textContent='Execution loaded: '+(execution.executionFingerprint||'no fingerprint')};
$('judgementsFile').onchange=async e=>{const x=await readJson(e.target.files[0]);judgements=Array.isArray(x)?x:(x.judgements||[]);$('summary').textContent='Judgments loaded: '+judgements.length};
$('statusFilter').onchange=renderQueue;
$('runBtn').onclick=()=>{if(!execution)return alert('Load execution JSON first.');const qids=[...new Set(judgements.flatMap(j=>Object.keys(j.answers||{})))];results=BlumAdjudicationExecutionCore.reconcile(execution,judgements,qids);renderQueue();const counts=results.reduce((o,r)=>(o[r.status]=(o[r.status]||0)+1,o),{});$('summary').textContent=`${results.length} units · resolved ${counts.resolved||0} · escalate ${counts.escalate||0} · incomplete ${counts.incomplete||0}`;};
function renderQueue(){const f=$('statusFilter').value,q=$('queue');q.innerHTML='';results.filter(r=>f==='all'||r.status===f).forEach(r=>{const d=document.createElement('div');d.className='row';d.innerHTML=`<span class="tag ${r.status}">${r.status}</span> ${escapeHtml(r.unitId)}<br><span class="muted">${r.readerCount}/${r.requiredReaders} readers · ${(r.escalationReasons||[]).join(', ')||'no escalation'}</span>`;d.onclick=()=>selectUnit(r.unitId,d);q.appendChild(d);});}
function selectUnit(unitId,node){document.querySelectorAll('.row').forEach(x=>x.classList.remove('active'));node.classList.add('active');const r=results.find(x=>x.unitId===unitId),rows=judgements.filter(x=>x.unitId===unitId);const packet=rows[0]&&rows[0].packetEvidence?$safe(rows[0].packetEvidence):null;$('evidence').innerHTML='<pre>'+escapeHtml(JSON.stringify(packet||{note:'Evidence is not duplicated in imported judgments. Open the frozen packet/assignment bundle for this unit.',unitId},null,2))+'</pre>';$('panel').innerHTML=Object.entries(r.questions||{}).map(([qid,c])=>`<div class="vote"><b>${escapeHtml(qid)}</b><br>consensus: ${escapeHtml(c.status)} · value: ${escapeHtml(String(c.value))}<br><span class="muted">${escapeHtml(JSON.stringify(c.counts))}</span></div>`).join('')+rows.map(j=>`<div class="vote"><b>${escapeHtml(j.readerSlot||'?')}</b> · ${escapeHtml((j.readerProvenance&&j.readerProvenance.model)||'unknown reader')}<pre>${escapeHtml(JSON.stringify(j.answers||{},null,2))}</pre></div>`).join('');}
function $safe(x){return x==null?null:x}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
