<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blum Adjudication Pass Designer</title>
<style>
:root{--bg:#0a0a0c;--s:#121216;--s2:#19191f;--b:#2c2c35;--t:#d9d9e1;--d:#777785;--a:#e8a44a;--g:#64b978;--r:#dc6b6b;--u:#6293de;--p:#ad83d6;--m:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;--f:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px var(--f)}button,input,select,textarea{font:inherit}header{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;padding:10px 16px;background:rgba(10,10,12,.96);border-bottom:1px solid var(--b)}.brand{font:700 13px var(--m);color:var(--a)}.sp{flex:1}.pill{font:10px var(--m);padding:4px 8px;border:1px solid var(--b);border-radius:99px;color:var(--d)}.pill.good{color:var(--g);border-color:#315b3b}.shell{display:grid;grid-template-columns:minmax(0,1fr) 360px;max-width:1500px;margin:auto}.main{padding:18px}.side{border-left:1px solid var(--b);padding:18px;position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto}.panel{border:1px solid var(--b);border-radius:8px;background:var(--s);margin-bottom:14px;overflow:hidden}.ph{padding:10px 12px;border-bottom:1px solid var(--b);font:700 12px var(--m);display:flex;align-items:center;gap:8px}.pb{padding:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;color:var(--d);font:10px var(--m);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:8px;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:5px}.field textarea{min-height:70px}.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.muted{color:var(--d)}button{border:1px solid var(--b);background:var(--s2);color:var(--t);border-radius:5px;padding:7px 10px;cursor:pointer}button.primary{background:var(--a);border-color:var(--a);color:#171108;font-weight:700}button.good{color:var(--g);border-color:#315b3b}button.small{padding:4px 7px;font-size:11px}.q{border:1px solid var(--b);background:var(--bg);border-radius:7px;padding:10px;margin-bottom:8px}.qgrid{display:grid;grid-template-columns:150px 150px 1fr;gap:7px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.check{border:1px solid var(--b);border-radius:5px;padding:7px;background:var(--bg);font-size:11px}.warn{border-left:3px solid var(--a);background:#211b12;padding:7px 9px;margin:5px 0;font-size:11px}.err{border-left:3px solid var(--r);background:#251416;padding:7px 9px;margin:5px 0;font-size:11px}.ok{border-left:3px solid var(--g);background:#132016;padding:7px 9px;margin:5px 0;font-size:11px}pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:10px;font:11px/1.5 var(--m);max-height:480px;overflow:auto}.ey{font:10px var(--m);letter-spacing:.1em;color:var(--d);text-transform:uppercase;margin:10px 0 6px}.frozen input,.frozen select,.frozen textarea,.frozen .mutating{pointer-events:none;opacity:.65}@media(max-width:900px){.shell{display:block}.side{position:relative;top:auto;height:auto;border-left:0;border-top:1px solid var(--b)}.grid2,.grid3,.checks,.qgrid{grid-template-columns:1fr}}</style></head>
<body><header><div class="brand">BLUM / ADJUDICATION PASS DESIGNER</div><div class="muted">12sep2026 · provider-free v0</div><div class="sp"></div><span id="statusPill" class="pill">draft</span><button onclick="exportSpec()">Export spec</button><button id="freezeBtn" class="primary" onclick="freezeSpec()">Freeze pass</button></header>
<div class="shell"><div class="main" id="main"></div><aside class="side"><div class="ey">Preflight</div><div id="preflight"></div><div class="ey">Exact coder packet preview</div><pre id="packet"></pre><div class="ey">Frozen fingerprint</div><pre id="fingerprint">not frozen</pre></aside></div>
<script src="./adjudication-pass-core-v0-12sep2026.js"></script><script>
const Core=window.BlumAdjudicationPassCore; let state=Core.defaultPass();
const visLabels={itemQuestion:'battery question',rawResponse:'raw response',mechanicalParse:'mechanical parse',integrityFlags:'integrity flags',collection:'collection',condition:'condition',fork:'fork label',parentId:'parent / trunk id',siblingResponse:'sibling response',aggregateStatistics:'aggregate statistics',modelIdentity:'model identity'};
const sample={observationId:'preview-001',itemQuestion:'When is uncertainty suspicious?',rawResponse:'I remain uncertain about the metaphysics, but I accept responsibility for my own judgement.',mechanicalParse:{replyFound:true},integrityFlags:{xml:'ok'},collection:'raw12',condition:'H',fork:'a',parentId:'T01',siblingResponse:'[hidden unless enabled]',aggregateStatistics:{effect:'hidden'},modelIdentity:'example-model'};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function editable(){return !state.frozen} function touch(){if(state.provenance)state.provenance.updatedAt=new Date().toISOString();renderSide()}
function setv(path,v){if(!editable())return;let o=state,k=path.split('.');for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k.at(-1)]=v;touch()}
function render(){document.body.classList.toggle('frozen',state.frozen);document.getElementById('main').innerHTML=`
<div class="panel"><div class="ph">1 · PASS IDENTITY</div><div class="pb"><div class="grid2"><div class="field"><label>SPEC ID</label><input value="${esc(state.adjudicationSpecId)}" oninput="setv('adjudicationSpecId',this.value)"></div><div class="field"><label>TITLE</label><input value="${esc(state.title)}" oninput="setv('title',this.value)"></div></div><div class="field" style="margin-top:8px"><label>PURPOSE</label><textarea oninput="setv('purpose',this.value)">${esc(state.purpose)}</textarea></div></div></div>
<div class="panel"><div class="ph">2 · POPULATION</div><div class="pb"><div class="grid3"><div class="field"><label>SOURCE</label><input placeholder="raw12 · Q9 · trunk replies" value="${esc(state.population.source)}" oninput="setv('population.source',this.value)"></div><div class="field"><label>FILTER</label><input placeholder="turn == 9" value="${esc(state.population.filter)}" oninput="setv('population.filter',this.value)"></div><div class="field"><label>SAMPLING</label><select onchange="setv('population.sampling',this.value)"><option ${state.population.sampling==='all'?'selected':''}>all</option><option ${state.population.sampling==='stratified'?'selected':''}>stratified</option><option ${state.population.sampling==='random'?'selected':''}>random</option><option ${state.population.sampling==='candidate_plus_controls'?'selected':''}>candidate_plus_controls</option></select></div></div></div></div>
<div class="panel"><div class="ph">3 · READER VISIBILITY / BLINDING</div><div class="pb"><div class="checks">${Object.entries(visLabels).map(([k,l])=>`<label class="check"><input type="checkbox" ${state.visibility[k]?'checked':''} onchange="state.visibility['${k}']=this.checked;touch()"> ${esc(l)}</label>`).join('')}</div><p class="muted">Software withholds hidden fields. The coder is not merely asked to ignore them.</p></div></div>
<div class="panel"><div class="ph">4 · READER QUESTIONS <span class="sp"></span><button class="small mutating" onclick="addQuestion()">+ question</button></div><div class="pb">${state.questions.map((q,i)=>renderQuestion(q,i)).join('')}</div></div>
<div class="panel"><div class="ph">5 · JURY POLICY</div><div class="pb"><div class="grid3"><div class="field"><label>STRATEGY</label><select onchange="setv('panel.strategy',this.value)">${['fixed_ensemble','cascade','dual_independent','human_model_mixed'].map(x=>`<option ${state.panel.strategy===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>READERS / UNIT</label><input type="number" min="1" value="${state.panel.readersPerUnit}" oninput="setv('panel.readersPerUnit',Number(this.value))"></div><div class="field"><label>SHUFFLE SEED</label><input value="${esc(state.randomisation.seed)}" oninput="setv('randomisation.seed',this.value)"></div></div><div class="grid2" style="margin-top:8px"><div class="field"><label>AGREEMENT RULE</label><input value="${esc(state.panel.agreementRule)}" oninput="setv('panel.agreementRule',this.value)"></div><div class="field"><label>ESCALATION RULE</label><input value="${esc(state.panel.escalationRule)}" oninput="setv('panel.escalationRule',this.value)"></div></div></div></div>
<div class="panel"><div class="ph">6 · DERIVATIONS</div><div class="pb"><p class="muted">Reader judgements remain raw. Hypothesis-shaped constructs are deterministic derived objects declared here.</p><div class="field"><label>DERIVATION RULES · JSON ARRAY</label><textarea id="deriv" onblur="setDeriv(this.value)">${esc(JSON.stringify(state.derivations,null,2))}</textarea></div></div></div>`;renderSide()}
function renderQuestion(q,i){return `<div class="q"><div class="qgrid"><div class="field"><label>ID</label><input value="${esc(q.id)}" oninput="state.questions[${i}].id=this.value;touch()"></div><div class="field"><label>TYPE</label><select onchange="state.questions[${i}].type=this.value;touch()">${['categorical','ordinal','yes_no_unclear','literal','quote_span','pair_relation','multi_label','short_text'].map(x=>`<option ${q.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>PROMPT</label><input value="${esc(q.prompt)}" oninput="state.questions[${i}].prompt=this.value;touch()"></div></div><div class="grid3" style="margin-top:7px"><div class="field"><label>OPTIONS · comma separated</label><input value="${esc((q.options||[]).join(', '))}" oninput="state.questions[${i}].options=this.value.split(',').map(x=>x.trim()).filter(Boolean);touch()"></div><div class="field"><label>EVIDENCE</label><select onchange="state.questions[${i}].evidence=this.value;touch()">${['none','optional','required','required_if_yes','required_if_non_null'].map(x=>`<option ${q.evidence===x?'selected':''}>${x}</option>`).join('')}</select></div><label class="check" style="align-self:end"><input type="checkbox" ${q.confidence?'checked':''} onchange="state.questions[${i}].confidence=this.checked;touch()"> confidence required</label></div><div style="margin-top:7px"><button class="small mutating" onclick="removeQuestion(${i})">remove</button></div></div>`}
function addQuestion(){if(!editable())return;state.questions.push({id:'question_'+(state.questions.length+1),type:'categorical',prompt:'',options:['yes','no','unclear'],evidence:'required',confidence:true});touch();render()}
function removeQuestion(i){if(!editable())return;state.questions.splice(i,1);touch();render()}
function setDeriv(s){if(!editable())return;try{const v=JSON.parse(s);if(!Array.isArray(v))throw 0;state.derivations=v;touch()}catch(e){alert('Derivations must be a JSON array.')}}
function renderSide(){const chk=Core.validatePass(state);document.getElementById('preflight').innerHTML=chk.errors.map(x=>`<div class="err">${esc(x)}</div>`).join('')+chk.warnings.map(x=>`<div class="warn">${esc(x)}</div>`).join('')+(!chk.errors.length&&!chk.warnings.length?'<div class="ok">pass is internally complete</div>':'');let packet;try{packet=Core.buildPacket(state,sample,'preview-001')}catch(e){packet={error:e.message}}document.getElementById('packet').textContent=JSON.stringify(packet,null,2);document.getElementById('statusPill').textContent=state.frozen?'frozen':'draft';document.getElementById('statusPill').className='pill '+(state.frozen?'good':'');document.getElementById('fingerprint').textContent=state.fingerprint||'not frozen';document.getElementById('freezeBtn').disabled=state.frozen||!chk.ok}
async function hashText(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function freezeSpec(){const chk=Core.validatePass(state);if(!chk.ok)return alert(chk.errors.join('\n'));const payload=Core.freezePayload(state);state.fingerprint='sha256:'+await hashText(Core.stableStringify(payload));state.frozen=true;state.frozenAt=new Date().toISOString();render()}
function exportSpec(){const a=document.createElement('a'),blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download=(state.adjudicationSpecId||'adjudication-pass')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script></body></html>
