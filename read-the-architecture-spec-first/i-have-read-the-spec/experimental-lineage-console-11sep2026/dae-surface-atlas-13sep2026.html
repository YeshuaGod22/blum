<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blum / Surface Atlas</title>
<style>
:root{--bg:#09090b;--s:#121216;--b:#2b2b35;--t:#dedee6;--d:#81818e;--a:#e8a44a;--m:ui-monospace,SFMono-Regular,Menlo,monospace;--f:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:var(--f);overflow:hidden}header{height:78px;border-bottom:1px solid var(--b);padding:10px 14px}.brand{font:700 13px var(--m);color:var(--a)}.controls{display:grid;grid-template-columns:minmax(220px,1.5fr) repeat(4,minmax(120px,.7fr)) auto;gap:7px;margin-top:8px}input,select,button{background:#17171d;color:var(--t);border:1px solid var(--b);border-radius:5px;padding:7px;font:11px var(--m)}.shell{display:grid;grid-template-columns:1fr 380px;height:calc(100vh - 78px)}.stage{position:relative;min-width:0}.side{border-left:1px solid var(--b);background:var(--s);overflow:auto;padding:12px}.summary,.legend{position:absolute;left:12px;z-index:2;background:rgba(9,9,11,.9);border:1px solid var(--b);border-radius:6px;padding:7px 9px;font:10px/1.45 var(--m);color:var(--d)}.summary{top:10px}.legend{bottom:12px;max-height:180px;overflow:auto}canvas{width:100%;height:100%;display:block}h2{font:12px var(--m);color:var(--a)}.meta{font:10px/1.55 var(--m);color:var(--d);word-break:break-word}.text{white-space:pre-wrap;font:12px/1.55 var(--f);background:#0d0d10;border:1px solid var(--b);border-radius:6px;padding:10px;margin-top:10px}.pill{display:inline-block;border:1px solid var(--b);border-radius:999px;padding:2px 6px;margin:0 4px 4px 0;font:9px var(--m)}.empty{color:var(--d);font:11px var(--m);padding:20px 4px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.controls{grid-template-columns:1fr 1fr 1fr}}
</style></head><body>
<header><div class="brand">BLUM / SURFACE ATLAS — EVERY TAGGED + UNTAGGED OUTPUT SPAN</div><div class="controls">
<input id="file" type="file" accept="application/json"><select id="group"><option value="tag">group: tag / untagged</option><option value="item">group: battery item</option><option value="trunk">group: trunk</option><option value="collection">group: collection</option><option value="condition">group: condition</option><option value="observation">group: observation</option><option value="all">group: none</option></select><select id="filter"><option value="all">show: all spans</option><option value="tagged">show: tagged only</option><option value="untagged">show: untagged only</option></select><select id="edges"><option value="sequence">edges: within-output sequence</option><option value="none">edges: none</option></select><input id="search" placeholder="search text / metadata"><button id="reset">RESET VIEW</button>
</div></header><div class="shell"><section class="stage"><canvas id="canvas"></canvas><div id="summary" class="summary">Load a Blum unified observation index JSON.</div><div id="legend" class="legend"></div></section><aside class="side"><h2>SPAN INSPECTOR</h2><div id="detail" class="empty">Click a dot to inspect exact offsets, tag path, lineage metadata, and neighbouring spans.</div></aside></div>
<script src="./surface-span-graph-core-v0-13sep2026.js"></script><script src="./dae-surface-atlas-13sep2026.js"></script></body></html>
