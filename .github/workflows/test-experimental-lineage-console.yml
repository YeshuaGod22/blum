name: Test experimental lineage console

on:
  pull_request:
    paths:
      - 'read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026/**'
      - '.github/workflows/test-experimental-lineage-console.yml'
  push:
    branches:
      - experimental-lineage-console-11sep2026
    paths:
      - 'read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026/**'
      - '.github/workflows/test-experimental-lineage-console.yml'

permissions:
  contents: read

jobs:
  vertical-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Blum branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test lineage runner core
        working-directory: read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026
        run: node test-experimental-lineage-runner-core-v0-11sep2026.js
      - name: Test lexical output analysis v0
        working-directory: read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026
        run: node test-lexical-output-analysis-v0-12sep2026.js
      - name: Test lexical applicability and behavioral routing
        working-directory: read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026
        run: node test-output-analysis-applicability-v1-12sep2026.js
      - name: Test DAE raw-call lineage import adapter
        working-directory: read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026
        run: node test-dae-raw-call-lineage-import-adapter-v0-11sep2026.js
      - name: Test imported observations through shared analysis path
        working-directory: read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026
        run: node test-retrospective-observation-analysis-v0-11sep2026.js
      - name: Test corpus-level DAE lineage import census
        working-directory: read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026
        run: node test-dae-corpus-lineage-import-cli-v0-11sep2026.js
      - name: Checkout pinned DAE witness corpus
        uses: actions/checkout@v4
        with:
          repository: YeshuaGod22/DevelopmentalAttractorEngineering
          ref: e2d484b41461013832c00e9f1ba3549ac0ef2517
          path: dae-witness
      - name: Verify importer against real DAE raw2
        working-directory: read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026
        run: node test-real-dae-raw2-integration-v0-11sep2026.js "$GITHUB_WORKSPACE/dae-witness"
      - name: Verify importer against real DAE raw12 integrity cases
        working-directory: read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026
        run: node test-real-dae-raw12-integration-v0-11sep2026.js "$GITHUB_WORKSPACE/dae-witness"
      - name: Verify lexical analyzer against real DAE item history
        working-directory: read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026
        run: node test-real-dae-lexical-analysis-v0-12sep2026.js "$GITHUB_WORKSPACE/dae-witness"
