name: Raw12 paper counterparts

on:
  push:
    branches:
      - experimental-lineage-console-11sep2026
    paths:
      - '.github/workflows/raw12-paper-counterparts.yml'
      - 'read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026/raw12-paper-counterpart-selection-v0-13sep2026.json'
      - 'read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026/raw12-cold-counterpart-resolver-v0-13sep2026.js'
      - 'read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026/build-raw12-cold-counterpart-report-v0-13sep2026.js'
      - 'read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026/dae-whole-corpus-index-cli-v1-12sep2026.js'
      - 'read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026/dae-whole-corpus-index-core-v1-12sep2026.js'
  workflow_dispatch:

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blum branch
        uses: actions/checkout@v4

      - name: Checkout DAE corpus
        uses: actions/checkout@v4
        with:
          repository: YeshuaGod22/DevelopmentalAttractorEngineering
          path: dae

      - name: Build counterpart report
        id: report
        shell: bash
        run: |
          set -euo pipefail
          LAB='read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026'
          mkdir -p paper-counterparts
          node "$LAB/build-raw12-cold-counterpart-report-v0-13sep2026.js" \
            "$GITHUB_WORKSPACE/dae/experiments/EXP-003-the-sixth-question" \
            "$GITHUB_WORKSPACE/paper-counterparts/raw12-cold-counterpart-report-v0.json" \
            | tee "$GITHUB_WORKSPACE/paper-counterparts/run-summary.json"

      - name: Summarize for agents and humans
        shell: bash
        run: |
          echo '## Raw12 paper counterpart report' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat paper-counterparts/run-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload provenance-bearing report
        uses: actions/upload-artifact@v4
        with:
          name: raw12-paper-counterparts
          path: paper-counterparts/
          if-no-files-found: error
