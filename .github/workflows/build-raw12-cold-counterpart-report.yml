name: Build raw12 cold counterpart report

on:
  push:
    branches:
      - experimental-lineage-console-11sep2026
    paths:
      - 'read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026/build-raw12-cold-counterpart-report-v0-13sep2026.js'
      - 'read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026/raw12-cold-counterpart-resolver-v0-13sep2026.js'
      - 'read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026/dae-raw-call-lineage-import-adapter-v0-11sep2026.js'
      - 'read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026/dae-corpus-lineage-import-cli-v0-11sep2026.js'
      - 'read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026/dae-unified-observation-index-v1-12sep2026.js'
      - 'read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026/dae-whole-corpus-index-cli-v1-12sep2026.js'
      - '.github/workflows/build-raw12-cold-counterpart-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Blum
        uses: actions/checkout@v4
      - name: Checkout current DAE corpus
        uses: actions/checkout@v4
        with:
          repository: YeshuaGod22/DevelopmentalAttractorEngineering
          ref: main
          path: dae
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build counterpart report
        working-directory: read-the-architecture-spec-first/i-have-read-the-spec/experimental-lineage-console-11sep2026
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/raw12-cold-counterparts"
          node build-raw12-cold-counterpart-report-v0-13sep2026.js \
            "$GITHUB_WORKSPACE/dae/experiments/EXP-003-the-sixth-question" \
            "$GITHUB_WORKSPACE/dist/raw12-cold-counterparts/raw12-cold-counterpart-report-v0.json"
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: raw12-cold-counterpart-report
          path: dist/raw12-cold-counterparts
          if-no-files-found: error
          retention-days: 30
